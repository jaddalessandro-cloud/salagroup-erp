name: Diagnóstico (solo lectura)

# Revisa la base de datos sin modificarla: cantidad de planillas y registros, y estado de cada usuario.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT || 'erp-sala-group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41294063283/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@erp-sala-group.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bases de Firestore
        run: gcloud firestore databases list --project "$PROYECTO" --format="table(name,type,locationId)" || true
      - name: Contenido
        env:
          FIREBASE_PROJECT: ${{ env.PROYECTO }}
          GCLOUD_PROJECT: ${{ env.PROYECTO }}
        run: node scripts/diagnostico.js
        working-directory: functions
