name: Activar adjuntos (Storage)

# Crea el depósito de archivos de Firebase (Storage) en São Paulo si todavía no existe
# y publica sus reglas de seguridad. Se puede correr más de una vez.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  activar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT || 'erp-sala-group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41294063283/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@erp-sala-group.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Crear depósito de Storage
        run: |
          gcloud services enable firebasestorage.googleapis.com storage.googleapis.com --project "$PROYECTO" || echo "(no se pudieron habilitar servicios: se sigue igual)"
          TOKEN=$(gcloud auth print-access-token)
          CODE=$(curl -s -o r.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "x-goog-user-project: $PROYECTO" \
            "https://firebasestorage.googleapis.com/v1beta/projects/$PROYECTO/defaultBucket" \
            -d '{"location":"southamerica-east1"}')
          cat r.json; echo
          if [ "$CODE" = "200" ]; then echo "Depósito creado."; 
          elif [ "$CODE" = "409" ]; then echo "El depósito ya existía.";
          else echo "::error::No se pudo crear el depósito (HTTP $CODE)."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar reglas de Storage
        run: npx --yes firebase-tools@15.37.0 deploy --project "$PROYECTO" --only storage --non-interactive --force
