name: Activar adjuntos (Storage)

# Crea el depósito de archivos de Firebase (Storage) en São Paulo si todavía no existe
# y publica sus reglas de seguridad. Se puede correr más de una vez.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  activar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT || 'erp-sala-group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41294063283/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@erp-sala-group.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Estado de Storage
        id: estado
        run: |
          TOKEN=$(gcloud auth print-access-token)
          curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROYECTO" "https://firebasestorage.googleapis.com/v1beta/projects/$PROYECTO/buckets" | tee b.json
          echo
          if npx --yes firebase-tools@15.37.0 deploy --project "$PROYECTO" --only storage --non-interactive --force; then
            echo "listo=1" >> "$GITHUB_OUTPUT"; echo "Storage activo: reglas publicadas."
          else echo "listo=0" >> "$GITHUB_OUTPUT"; fi
      - name: Crear depósito de Storage
        if: steps.estado.outputs.listo != '1'
        run: |
          TOKEN=$(gcloud auth print-access-token)
          CODE=$(curl -s -o r.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "x-goog-user-project: $PROYECTO" \
            "https://firebasestorage.googleapis.com/v1beta/projects/$PROYECTO/defaultBucket" \
            -d '{"location":"southamerica-east1"}')
          cat r.json; echo
          if [ "$CODE" = "200" ] || [ "$CODE" = "409" ]; then
            npx --yes firebase-tools@15.37.0 deploy --project "$PROYECTO" --only storage --non-interactive --force
          else
            echo "::error::Storage no está activado y esta cuenta no puede crearlo. Activalo en la consola de Firebase: Storage → Comenzar."; exit 1
          fi
