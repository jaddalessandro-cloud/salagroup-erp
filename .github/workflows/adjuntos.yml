name: Activar adjuntos (Storage)

# Crea el depósito de archivos de Firebase (Storage) en São Paulo si todavía no existe
# y publica sus reglas de seguridad. Se puede correr más de una vez.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  activar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT || 'erp-sala-group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41294063283/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@erp-sala-group.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar reglas de Storage
        run: TOKEN=$(gcloud auth print-access-token) BUCKET="${PROYECTO}.firebasestorage.app" node tools/reglas-storage.mjs
