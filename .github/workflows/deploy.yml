
name: Publicar

# Prueba y publica el sistema en Firebase cada vez que cambia la rama main.
# Autenticación mediante Workload Identity Federation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT || 'erp-sala-group' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de Functions
        run: npm ci
        working-directory: functions

      - name: Pruebas
        run: npm test

      - name: Armar
        run: npm run build

      - name: Autenticación Google mediante WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41294063283/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@erp-sala-group.iam.gserviceaccount.com

      - name: Publicar en Firebase
        run: npx --yes firebase-tools@15.37.0 deploy --project "$PROYECTO" --only firestore,functions,hosting --non-interactive --force

      # Reglas de los adjuntos (Storage), publicadas por la API de reglas
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publicar reglas de adjuntos (Storage)
        run: |
          TOKEN=$(gcloud auth print-access-token) BUCKET="${PROYECTO}.firebasestorage.app" node tools/reglas-storage.mjs
